model_id: google/gemma-4-E4B
# Smoke / local 8GB:
# model_id: google/gemma-4-E2B
revision: main
trust_remote_code: true
torch_dtype: bfloat16
attn_implementation: sdpa
use_base_not_it: true
max_soft_tokens: 560
max_model_len: 4096
lora:
  r: 16
prompt_template: |
  Reconstruct the diagram as one complete native SVG.
  Use viewBox="{viewbox}" and preserve the diagram's aspect ratio, layout, text, shapes, and connections.
  Output only SVG markup. End with </svg>.
svg_prefix_scaffold: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 512 512\" width=\"512\" height=\"512\">"
generation:
  # vfig_id gold target length: p50=1828, p90=3745 tokens (outputs/metrics/token_audit.json).
  # A 1536-token / 90 s budget guillotined every pred at ~695 tokens; do not reintroduce.
  max_new_tokens: 4096
  max_time: null
  do_sample: false
  temperature: 0.0
