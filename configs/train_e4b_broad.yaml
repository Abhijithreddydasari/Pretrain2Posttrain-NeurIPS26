model_id: google/gemma-4-E4B
revision: main
trust_remote_code: true
torch_dtype: bfloat16
load_in_4bit: false
attn_implementation: sdpa
use_base_not_it: true
prompt_template: |
  Reconstruct the diagram as a single canonical SVG.
  Use viewBox="0 0 512 512". Output only SVG markup.
svg_prefix_scaffold: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 512 512\" width=\"512\" height=\"512\">"
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: all-linear
  bias: none
  task_type: CAUSAL_LM
train:
  output_dir: outputs/e4b_broad
  num_train_epochs: 3
  per_device_train_batch_size: 3
  gradient_accumulation_steps: 3  # effective batch 9; probe OK on A100-80GB (~64 GB peak VRAM)
  learning_rate: 1.0e-4
  logging_steps: 10
  max_seq_length: 4096
  optim: adamw_torch
  bf16: true
  gradient_checkpointing: false
  dataloader_pin_memory: true
  dataloader_num_workers: 0  # must stay 0: model on CUDA before DataLoader; forked workers crash
  remove_unused_columns: false
  report_to: none
  seed: 42
data:
  manifest: data/processed/svg_diagrams/train_manifest.jsonl
  max_samples: 2000
  match_token_budget: true
checkpoints_pct: [0, 5, 10, 20, 40, 60, 80, 100]
eval:
  after_train: true
  splits: [id, ood]
