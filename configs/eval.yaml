canonical_viewbox: "0 0 512 512"
max_elements: 200
max_svg_chars: 20000
min_drawable_elements: 2
forbidden_tags:
  - script
  - foreignObject
  - image
  - animate
  - animateTransform
  - animateMotion
  - set
  - audio
  - video
metrics:
  primary:
    - parse_render_validity
    - svg_close_rate
    - length_limit_rate
    - ssim_all_examples
    - recovered_validity
    - emergence_t50_t90
  secondary:
    - dino_similarity
    - valid_only_similarity
    - compactness
controls:
  - correct
  - shuffled
  - blank
checkpoints_pct: [0, 5, 10, 20, 40, 60, 80, 100]
bootstrap_samples: 1000
generation_cache_dir: outputs/generations
metrics_dir: outputs/metrics
